name: Desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned tools
        run: |
          npm install --global pnpm@12.18.0
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustc --version
          uname -a
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb dbus-x11 desktop-file-utils
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm check:repository
      - run: pnpm check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Native macOS app smoke
        if: runner.os == 'macOS'
        run: pnpm test:e2e
      - name: Native Linux app smoke under X11
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- pnpm test:e2e
      - name: Production macOS bundle
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles app,dmg
      - name: Production Linux package
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles deb
      - run: pnpm check:release
      - name: Verify and copy the local macOS DMG
        if: runner.os == 'macOS'
        run: |
          image=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          python3 scripts/check-macos-package.py --dmg "$image"
      - name: Validate and sample macOS process counters
        if: runner.os == 'macOS'
        run: |
          python3 benchmarks/macos_rusage.py > artifacts/rusage-self-check.json
          python3 benchmarks/release_profile.py --binary src-tauri/target/release/bundle/macos/Marktub.app/Contents/MacOS/marktub --label installed-macos-empty --rusage --samples 3 --interval 10 --output artifacts/installed-macos-profile.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/installed-macos-profile.json").read_text())
          assert data["lifecycleAttributionConfirmed"] and data["documentUnchanged"]
          assert all(not sample["counterErrors"] and sample.get("footprintExitCode") == 0 and not sample.get("footprintErrors") for sample in data["samples"])
          assert all(sample["counterInterval"]["complete"] for sample in data["samples"][1:])
          PY
      - name: Install and smoke the declared Ubuntu amd64 package
        if: runner.os == 'Linux'
        run: |
          package=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          dpkg-deb --info "$package"
          sudo dpkg -i "$package"
          desktop-file-validate /usr/share/applications/Marktub.desktop
          xvfb-run -a dbus-run-session -- python3 benchmarks/release_profile.py --binary /usr/bin/marktub --document tests/fixtures/specimen.md --label installed-ubuntu-read --samples 2 --interval 5 --output artifacts/installed-linux.json
      - name: Preserve macOS executable permissions in the artifact
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          tar -czf artifacts/Marktub.app.tar.gz -C src-tauri/target/release/bundle/macos Marktub.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: |
            artifacts/*.json
            artifacts/*.tar.gz
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 7
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p artifacts
      - name: Production JavaScript advisories
        run: pnpm audit --prod --json > artifacts/production-advisories.json
      - name: All JavaScript advisories (known development findings are release blockers)
        continue-on-error: true
        id: javascript
        run: pnpm audit --json > artifacts/all-advisories.json
      - name: Install pinned Rust audit tool
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Rust advisories including unsound/unmaintained warnings
        continue-on-error: true
        id: rust
        run: cargo audit --file src-tauri/Cargo.lock --deny unsound --deny unmaintained --json > artifacts/rust-advisories.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-advisories
          path: artifacts/*advisories.json
      - name: Enforce unresolved advisory gate
        if: steps.javascript.outcome == 'failure' || steps.rust.outcome == 'failure'
        run: exit 1
