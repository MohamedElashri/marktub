name: Desktop checks

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - development.md
      - scripts/install.sh
      - tests/tooling/test_installer.py
      - .github/workflows/install.yml
  pull_request:
    paths-ignore:
      - README.md
      - development.md
      - scripts/install.sh
      - tests/tooling/test_installer.py
      - .github/workflows/install.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned tools
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          rustup show
          rustc --version
          uname -a
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb openbox weston dbus-x11 desktop-file-utils texlive-xetex fonts-noto-core poppler-utils python3-gi gir1.2-atspi-2.0 at-spi2-core evince rpm libarchive-tools
      - name: Universal desktop macOS targets and SDK
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: macOS converter prerequisites (never app bootstrap)
        if: runner.os == 'macOS'
        run: |
          brew install poppler
          if ! test -x /Library/TeX/texbin/xelatex; then brew install --cask basictex; fi
          echo /Library/TeX/texbin >> "$GITHUB_PATH"
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install adjustbox fvextra booktabs float geometry amsmath amsfonts fontspec lm
      - name: Pinned desktop test converters (never app bootstrap)
        run: python3 scripts/fetch-test-tools.py --github-env "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm check:repository
      - run: pnpm check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Native dependency backport regressions
        if: runner.os == 'Linux'
        run: python3 scripts/check-dependencies.py --native
      - name: Native macOS app smoke
        if: runner.os == 'macOS'
        run: pnpm test:e2e
      - name: Native Linux app smoke under X11
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- sh -c 'openbox > /tmp/marktub-window-manager.log 2>&1 & exec pnpm test:e2e'
      - name: Native Wayland focus, editing and Arabic layout
        if: runner.os == 'Linux'
        env:
          MARKTUB_E2E_GREP: "OS file open and accessibility|Preferences and commands|syncs actual viewport positions both ways|keeps narrow panes and secondary actions reachable|Arabic reading layout|Continuous reader|exports Arabic with bundled PDF fonts"
        run: xvfb-run -a dbus-run-session -- python3 scripts/e2e-wayland.py
      - name: Production macOS bundle
        if: runner.os == 'macOS'
        run: python3 scripts/build-macos.py
      - name: Production Linux packages
        if: runner.os == 'Linux'
        run: |
          pnpm tauri build --bundles deb,rpm
          version=$(node -p 'require("./package.json").version')
          python3 scripts/prepare-rpm.py --version "$version"
      - run: pnpm check:release
      - name: Verify and copy the local macOS DMG
        if: runner.os == 'macOS'
        run: |
          image=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          python3 scripts/check-macos-package.py --dmg "$image"
      - name: Validate and sample macOS process counters
        if: runner.os == 'macOS'
        run: |
          python3 benchmarks/macos_rusage.py > artifacts/rusage-self-check.json
          python3 benchmarks/release_profile.py --binary src-tauri/target/universal-apple-darwin/release/bundle/macos/Marktub.app/Contents/MacOS/marktub --label installed-macos-empty --rusage --samples 3 --interval 10 --output artifacts/installed-macos-profile.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/installed-macos-profile.json").read_text())
          assert data["lifecycleAttributionConfirmed"] and data["documentUnchanged"]
          assert all(not sample["counterErrors"] and sample.get("footprintExitCode") == 0 and not sample.get("footprintErrors") for sample in data["samples"])
          assert all(sample["counterInterval"]["complete"] for sample in data["samples"][1:])
          PY
      - name: Install and smoke the declared Ubuntu amd64 package
        if: runner.os == 'Linux'
        run: |
          package=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          dpkg-deb --info "$package"
          python3 scripts/check-linux-package.py --deb "$package"
          sudo dpkg -i "$package"
          desktop-file-validate /usr/share/applications/Marktub.desktop
          GDK_BACKEND=x11 xvfb-run -a dbus-run-session -- sh -c 'openbox > /tmp/marktub-installed-window-manager.log 2>&1 & exec /usr/bin/python3 scripts/check-linux-installed.py --binary /usr/bin/marktub --example --desktop-integration --output artifacts/installed-linux-ui.json'
          xvfb-run -a dbus-run-session -- python3 benchmarks/release_profile.py --binary /usr/bin/marktub --document tests/fixtures/specimen.md --label installed-ubuntu-read --rusage --samples 2 --interval 5 --output artifacts/installed-linux.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/installed-linux.json").read_text())
          assert data["lifecycleAttributionConfirmed"] and data["documentUnchanged"]
          assert all(not sample["counterErrors"] and not sample.get("pssIncomplete") for sample in data["samples"])
          assert all(sample["counterInterval"]["complete"] for sample in data["samples"][1:])
          PY
      - name: Preserve macOS executable permissions in the artifact
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          tar -czf artifacts/Marktub.app.tar.gz -C src-tauri/target/universal-apple-darwin/release/bundle/macos Marktub.app
      - name: Verify RPM contents and Fedora dependency installation
        if: runner.os == 'Linux'
        run: |
          version=$(node -p 'require("./package.json").version')
          package="src-tauri/target/release/bundle/rpm/Marktub_${version}_x86_64.rpm"
          python3 scripts/check-linux-package.py --rpm "$package" --output artifacts/linux-rpm-package.json
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace fedora:44 bash scripts/check-fedora-rpm.sh "$package" "$version"
      - name: Sign checked update packages
        if: github.event_name != 'pull_request'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$RUNNER_OS" = macOS ]; then
            platform=darwin-universal
            package="artifacts/Marktub_${version}_universal.app.tar.gz"
            cp artifacts/Marktub.app.tar.gz "$package"
          else
            platform=linux-x86_64-deb
            package="src-tauri/target/release/bundle/deb/Marktub_${version}_amd64.deb"
          fi
          python3 scripts/update-manifest.py sign --platform "$platform" --package "$package" --output "artifacts/update-${platform}.json"
          if [ "$RUNNER_OS" = Linux ]; then
            python3 scripts/update-manifest.py sign --platform linux-x86_64-rpm --package "src-tauri/target/release/bundle/rpm/Marktub_${version}_x86_64.rpm" --output artifacts/update-linux-x86_64-rpm.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: |
            artifacts/*.json
            artifacts/native-*.png
            artifacts/*installed*.app.log
            artifacts/wdio/*.log
            artifacts/wayland-compositor.log
            artifacts/*.pdf
            artifacts/*.tar.gz
            artifacts/*.sig
            src-tauri/target/release/bundle/deb/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.sig
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 7
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p artifacts
      - name: Production JavaScript advisories
        run: pnpm audit --prod --json > artifacts/production-advisories.json
      - name: All JavaScript advisories (known development findings are release blockers)
        continue-on-error: true
        id: javascript
        run: pnpm audit --json > artifacts/all-advisories.json
      - name: Reviewed JavaScript backports and visible upstream advisories
        continue-on-error: true
        id: javascriptBackports
        run: |
          node scripts/check-javascript-overrides.mjs --audit
          node --test tests/tooling/picomatch-mitigation.test.mjs
      - name: Install pinned Rust audit tool
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Rust advisories including unsound/unmaintained warnings
        continue-on-error: true
        id: rust
        run: cargo audit --file src-tauri/Cargo.lock --deny unsound --deny unmaintained --json > artifacts/rust-advisories.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-advisories
          path: artifacts/*advisories.json
      - name: Enforce unresolved advisory gate
        if: steps.javascript.outcome == 'failure' || steps.javascriptBackports.outcome == 'failure' || steps.rust.outcome == 'failure'
        run: exit 1
