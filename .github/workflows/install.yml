name: Installation checks

on:
  push:
    branches: [main]
    paths:
      - README.md
      - development.md
      - scripts/install.sh
      - tests/tooling/test_installer.py
      - .github/workflows/install.yml
  pull_request:
    paths:
      - README.md
      - development.md
      - scripts/install.sh
      - tests/tooling/test_installer.py
      - .github/workflows/install.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Installer syntax and failure cases
        run: |
          /bin/bash -n scripts/install.sh
          python3 -m unittest discover -s tests/tooling -p test_installer.py -v
      - name: Download and verify the latest platform package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Authenticate only metadata; package/CDN requests remain anonymous.
          curl() {
            local address=${!#}
            if [[ "$address" == 'https://api.github.com/repos/MohamedElashri/marktub/releases/latest' ]]; then
              command curl --header "Authorization: Bearer $GH_TOKEN" "$@"
            else
              command curl "$@"
            fi
          }
          export -f curl
          /bin/bash scripts/install.sh --download-only --directory "$RUNNER_TEMP/marktub-download"
  rpm-download:
    name: Published RPM download on Fedora
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download and verify the latest RPM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dnf install -y coreutils grep gawk
          command -v curl >/dev/null || dnf install -y curl
          curl() {
            local address=${!#}
            if [[ "$address" == 'https://api.github.com/repos/MohamedElashri/marktub/releases/latest' ]]; then
              command curl --header "Authorization: Bearer $GH_TOKEN" "$@"
            else
              command curl "$@"
            fi
          }
          export -f curl
          bash scripts/install.sh --download-only --directory /tmp/marktub-download
