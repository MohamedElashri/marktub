[package]
name = "marktub"
version = "0.1.2"
description = "Offline Markdown reader and source-preserving editor"
authors = ["Marktub contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.99.1"
default-run = "marktub"

[lib]
name = "marktub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "=2.14.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
semver = "=1.0.28"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
notify = "8"
ignore = "=0.4.33"
base64 = "=0.22.1"
libc = "0.2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
sha1 = "=0.10.6"
globset = "=0.4.20"
rusqlite = { version = "=0.41.1", features = ["bundled", "hooks", "limits", "extra_check"] }
tauri-plugin-single-instance = "=2.5.5"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18"

[features]
default = []
blank-baseline = []
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[patch.crates-io]
glib = { path = "vendor/glib" }
glib-macros = { path = "vendor/glib-macros" }
gtk3-macros = { path = "vendor/gtk3-macros" }
tauri-plugin-single-instance = { path = "vendor/tauri-plugin-single-instance" }
